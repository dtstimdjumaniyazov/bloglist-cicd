name: Scheduled health check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: URL health check
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://bloglist-cicd-glimmering-bush-794.fly.dev/
          max-attempts: 3
          retry-delay: 5s 